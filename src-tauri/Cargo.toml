[package]
name = "noted"
description = "A quick scratchpad that lives one keypress away."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `_lib` suffix avoids a lib/bin name clash (rust-lang/cargo#8519).
name = "noted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noted-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via Tauri, which picks libappindicator. Turning on ksni
# makes tray-icon use its StatusNotifierItem backend instead, the only one that
# reports a left click (Activate), so clicking the icon can open the panel.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via Tauri; used to round the native window corners.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
