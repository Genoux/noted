<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noted</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body spellcheck="false">
    <div id="tabs" role="tablist" aria-label="Notes" data-tauri-drag-region></div>
    <div id="page">
      <main id="editor"></main>
      <footer data-tauri-drag-region>
        <span data-tauri-drag-region>
          <span id="tray-status" role="status"></span><span id="words" data-tauri-drag-region></span>
        </span>
        <span class="footer-actions" data-tauri-drag-region>
          <button id="help" class="footer-btn" type="button" title="Shortcuts (⌘/)" aria-label="Shortcuts">?</button>
          <button id="text-size" class="footer-btn" type="button" title="Text size (⌘- / ⌘=)" aria-label="Text size"><span aria-hidden="true">Aa</span></button>
          <button id="tray-toggle" class="footer-btn" type="button" title="Tray icon" aria-label="Show tray icon" aria-pressed="false" disabled>
            <svg class="tray-glyph" viewBox="0.75 0 14.5 16" width="11.8" height="13" aria-hidden="true">
              <mask id="tray-cut">
                <rect width="16" height="16" fill="white" />
                <path d="M2 2l12 12" stroke="black" stroke-width="3.5" />
              </mask>
              <g class="tray-body" mask="url(#tray-cut)">
                <path d="M1.5 9l2-5.5h9l2 5.5v3.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" />
                <path d="M1.5 9H5l1 1.75h4L11 9h3.5" />
              </g>
              <path class="tray-slash" d="M2 2l12 12" />
            </svg>
          </button>
          <span data-tauri-drag-region>esc to close</span>
        </span>
      </footer>
    </div>
  </body>
</html>
